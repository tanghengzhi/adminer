services:
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER= # Optional: Specify default database server (e.g., db for MySQL service)
      - ADMINER_PLUGINS=dark-switcher
      - ADMINER_DESIGN= # Optional: Set a theme for Adminer
      - ADMINER_LOGIN_SERVERS=[] # Optional: JSON config for common server accounts on trusted devices
    volumes:
      - ./plugins-enabled/001-login-servers.php:/var/www/html/plugins-enabled/001-login-servers.php:ro
    networks:
      - adminer-network

networks:
  adminer-network:
    driver: bridge
