services:
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER= # Optional: Specify default database server (e.g., db for MySQL service)
      - ADMINER_PLUGINS=dark-switcher
      - ADMINER_DESIGN=pepa-linha # Optional: Set a theme for Adminer
    networks:
      - adminer-network

networks:
  adminer-network:
    driver: bridge
